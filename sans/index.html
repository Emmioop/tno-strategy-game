<script>
// ★ CDN 加速钩子：在任何其他脚本之前运行，拦截所有相对路径资源请求
(function(){
    var CDN = 'https://cdn.jsdelivr.net/gh/Emmioop/tno-strategy-game@gh-pages/';
    var LOCAL = window.location.protocol + '//' + window.location.host + '/';
    var onLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    
    function toCDN(url) {
        if (!url || /^(https?:)?\/\//.test(url) || /^data:/.test(url) || /^blob:/.test(url)) return url;
        // 相对路径 -> CDN
        var clean = url.replace(/^\.?\//, '');
        return CDN + clean;
    }
    
    // 1. Hook XMLHttpRequest（c2runtime.js 用它加载 data.js）
    var _open = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(method, url, async, user, pass) {
        var args = Array.prototype.slice.call(arguments);
        if (!onLocal && typeof url === 'string') {
            args[1] = toCDN(url);
        }
        return _open.apply(this, args);
    };
    
    // 2. Hook Image.src（Construct 2 加载图片用 new Image().src）
    var _origSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
    Object.defineProperty(HTMLImageElement.prototype, 'src', {
        get: function(){ return _origSrc.get.call(this); },
        set: function(v) {
            if (!onLocal && typeof v === 'string' && !this._cdnSet) {
                v = toCDN(v);
                this._cdnSet = true;
            }
            _origSrc.set.call(this, v);
        },
        configurable: true
    });
    
    // 3. Hook Audio.src（Construct 2 加载音频）
    if (window.Audio) {
        var _audioSrc = Object.getOwnPropertyDescriptor(HTMLAudioElement.prototype, 'src');
        if (_audioSrc) {
            Object.defineProperty(HTMLAudioElement.prototype, 'src', {
                get: function(){ return _audioSrc.get.call(this); },
                set: function(v) {
                    if (!onLocal && typeof v === 'string' && !this._cdnSet) {
                        v = toCDN(v);
                        this._cdnSet = true;
                    }
                    _audioSrc.set.call(this, v);
                },
                configurable: true
            });
        }
    }
})();
</script>
<script>
// vpad.js - virtual buttons + auto-skip loader
'use strict';

var bar = document.createElement('div');
bar.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:3px;background:rgba(255,255,255,.15);z-index:999999;pointer-events:none;transition:opacity .6s;';
var fill = document.createElement('div');
fill.style.cssText = 'width:0%;height:100%;background:linear-gradient(90deg,#ff4444,#ff8844);transition:width .2s linear;';
bar.appendChild(fill);

var pct = document.createElement('div');
pct.style.cssText = 'position:fixed;top:8px;left:8px;z-index:999999;color:#fff;font:13px monospace;text-shadow:0 0 3px #000;pointer-events:none;';

// 安全添加元素到 body
function addToBody(el) {
    if (document.body) {
        document.body.appendChild(el);
    } else {
        document.addEventListener('DOMContentLoaded', function() {
            document.body.appendChild(el);
        });
    }
}

addToBody(bar);
addToBody(pct);

window.vpadDebug = { setupCalled: false, pollCalls: 0 };

    // ★ v2: 强制清除所有旧状态 + 设置新版本（解决手机缓存旧版本问题）
    try {
        var __rm = [];
        for (var __k in localStorage) {
            if (__k.indexOf('ui_state') !== -1 || __k.indexOf('tno') !== -1 || __k.indexOf('sans') !== -1 || __k.indexOf('mc_') !== -1 || __k.indexOf('font') !== -1) {
                __rm.push(__k);
            }
        }
        __rm.forEach(function(k){ localStorage.removeItem(k); });
        localStorage.setItem('tno_v', '2');
        localStorage.setItem('ui_state', '2');
    } catch(e){}

    function getRuntime() {
    var rt = document.getElementById('c2canvas') && document.getElementById('c2canvas').c2runtime;
    if (!rt) rt = window.c2runtime;
    return rt;
}
function getLayout(name) {
    var rt = getRuntime();
    if (!rt || !rt.layouts) return null;
    var keys = Object.keys(rt.layouts);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i].toLowerCase() === name.toLowerCase()) return rt.layouts[keys[i]];
    }
    return null;
}

function vpadSetup() {
    window.vpadDebug.setupCalled = true;
    var tickBootstrapped = false;
    var origSizeFixed = false;

    // 强制隐藏所有 DOM 虚拟键盘元素（MobileControls.js 用 virt-ctrl canvas 自己画）
    try {
        var __hideIds = [
            'joystick-container','joystick-handle','joystick-mk',
            'arrow-up','arrow-left','arrow-right','arrow-down',
            'button-z','button-x','button-c',
            'toggle-button','keyboard-set','button-f1','button-f2','button-debug',
            'settings-overlay','settings-panel',
            'text-scale','text-opacity','text-joystickscale','text-reset'
        ];
        __hideIds.forEach(function(id){
            var el = document.getElementById(id);
            if (el) { el.style.display = 'none'; }
        });
    } catch(e){}

    // Loader 阶段就要驱动 tick 循环，否则 isloading 不会变 false
    window.__bootTickInterval = setInterval(function(){
        try {
            var r = getRuntime();
            if (r && !r.isSuspended) {
                r.redraw = true;
                r.tick(false);
            }
        } catch(e){}
    }, 16);

    setInterval(function(){
        window.vpadDebug.pollCalls++;
        try {
            var rt = getRuntime();
            if (!rt) return;

            if (rt.isSuspended) rt.isSuspended = false;

            // ── 每次 poll 都无条件锁死原始分辨率 + scale outer ──
            try {
                rt.original_width = 960;
                rt.original_height = 540;
                rt.fullscreen_mode = 4;
                rt.fullscreen_mode_set = 4;
                if (typeof rt.setSize === 'function') {
                    try { rt.setSize(window.innerWidth, window.innerHeight, true); } catch(e){}
                }
            } catch(e){}

            // ── 更新开始界面进度条（rt.progress 永远是 0，自己算）──
            try {
                var ssBar = document.getElementById('ssBar');
                var ssPct = document.getElementById('ssPct');
                if (ssBar && ssPct) {
                    if (!window.__ssLocalProgress) window.__ssLocalProgress = 0;
                    var r = getRuntime();
                    var ticking = !!(r && r.layouts && !r.isSuspended);
                    if (ticking && window.__ssLocalProgress < 1) {
                        // 已经在 tick 了，从 0 平滑升到 1 用 2 秒
                        window.__ssLocalProgress = Math.min(1, window.__ssLocalProgress + 0.08);
                    } else if (!ticking && window.__ssLocalProgress < 0.7) {
                        // 还没 tick，慢慢爬
                        window.__ssLocalProgress = Math.min(0.7, window.__ssLocalProgress + 0.02);
                    }
                    var lp = window.__ssLocalProgress;
                    ssBar.style.width = (lp * 100).toFixed(1) + '%';
                    ssPct.textContent = lp >= 1 ? 'READY' : 'LOADING ' + Math.round(lp * 100) + '%';
                }
            } catch(e){}

            var cur = rt.running_layout && rt.running_layout.name;
            var n = cur ? cur.toLowerCase() : '';

            // ── 尽早启动 tick 循环（runtime 一创建就启动，处理所有状态）──
            if (!tickBootstrapped && rt.layouts) {
                tickBootstrapped = true;
                rt.raf_id = -1;
                rt.timeout_id = -1;
                window.__vpadTickInterval = setInterval(function(){
                    try {
                        var r = getRuntime();
                        if (r && !r.isSuspended) {
                            r.redraw = true;
                            r.tick(false);
                        }
                    } catch(e){}
                }, 16);
            }

            // ── Loader 阶段：点开始后才切 BattleScreen ──
            if ((n === 'loader' || n === 'instructions') && !window.__startChangelogDone && window.__startScreenHidden) {
                window.__startChangelogDone = true;
                setTimeout(function(){
                    var r = getRuntime();
                    if (r && r.layouts) {
                        var target = r.layouts['BattleScreen'] || r.layouts['battlescreen'];
                        if (target) {
                            r.changelayout = target;
                            r._changeLayoutPending = false;
                        }
                    }
                }, 100);
            }

            if (!cur) return;

            // ── 强制背景永远纯黑 ──
            try {
                document.body.style.background = '#000';
                document.documentElement.style.background = '#000';
                var cv = document.querySelector('canvas');
                if (cv) cv.style.background = '#000';
                var cdiv = document.getElementById('c2canvasdiv');
                if (cdiv) cdiv.style.background = '#000';
            } catch(e){}

            if (n === 'battlescreen' || n === 'gameover') {
                try {
                    var layers = rt.running_layout.layers;
                    // Touch 层隐藏
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase() === 'touch') {
                            layers[i].instances.forEach(function(inst){ inst.opacity = 0; });
                            break;
                        }
                    }
                    // Fade 层清空
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase() === 'fade') {
                            layers[i].instances.length = 0;
                            break;
                        }
                    }
                    // CombatZoneClipped 禁用混合
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase().indexOf('clipped') >= 0) {
                            layers[i].forceOwnTexture = true;
                            layers[i].blend_mode = 0;
                        }
                    }
                } catch(e){}
            }

            if (n === 'battlescreen' && !window.__battleIntroDone) {
                window.__battleIntroDone = true;
                try {
                    // 把所有层 opacity 设为 0 → 画面完全纯黑，标题过场看不到任何东西
                    var L = rt.running_layout.layers;
                    for (var i = 0; i < L.length; i++) {
                        L[i].__saveOpacity = L[i].opacity;
                        L[i].opacity = 0;
                    }
                    // 狂按 Z 飞速跳过所有对话/标题过场（20次 × 120ms = 2.4秒）
                    var zCount = 0;
                    var zTimer = setInterval(function(){
                        zCount++;
                        if (zCount > 20) { clearInterval(zTimer); return; }
                        try {
                            var kd = new KeyboardEvent('keydown', {key:'z', code:'KeyZ', keyCode:90, which:90, bubbles:true});
                            document.dispatchEvent(kd);
                            setTimeout(function(){
                                var ku = new KeyboardEvent('keyup', {key:'z', code:'KeyZ', keyCode:90, which:90, bubbles:true});
                                document.dispatchEvent(ku);
                            }, 40);
                        } catch(e){}
                    }, 120);
                    // 2.8 秒后恢复所有层（过场应已全部跳完，进入正式战斗）
                    setTimeout(function(){
                        try {
                            var r = getRuntime();
                            if (r && r.running_layout && r.running_layout.name.toLowerCase() === 'battlescreen') {
                                var L2 = r.running_layout.layers;
                                for (var i = 0; i < L2.length; i++) {
                                    L2[i].opacity = L2[i].__saveOpacity !== undefined ? L2[i].__saveOpacity : 1;
                                }
                            }
                        } catch(e){}
                    }, 2800);
                } catch(e){}
            }

            if (n === 'battlescreen') {
                try {
                    var layers2 = rt.running_layout.layers;
                    // HP 保持满值
                    for (var i = 0; i < layers2.length; i++) {
                        if (layers2[i].name.toLowerCase() === 'hud') {
                            var insts = layers2[i].instances;
                            for (var j = 0; j < insts.length; j++) {
                                var inst = insts[j];
                                if (inst.type.name === 't78' && inst.text && inst.text.indexOf('/') >= 0) {
                                    if (inst.text !== '20 / 20') inst.text = '20 / 20';
                                }
                                if (inst.type.name === 't41') inst.width = 100;
                                if (inst.type.name === 't40') {
                                    inst.width = 100;
                                    inst.instance_vars = [0, 100, 30];
                                }
                            }
                            break;
                        }
                    }
                } catch(e){}
            }
        } catch(e){}
    }, 150);

    // ── 开始界面：runtime 一就绪立即移除 + 强制进 BattleScreen ──
    var ssBtn = document.getElementById('ssBtn');
    var ssEl = document.getElementById('startScreen');

    function doStart() {
        if (window.__startScreenHidden) return;
        window.__startScreenHidden = true;
        // 立即移除，不做 fade
        if (ssEl && ssEl.parentNode) {
            ssEl.parentNode.removeChild(ssEl);
        }
        try { window.dispatchEvent(new Event('resize')); } catch(e){}
    }

    function forceBattleScreen() {
        try {
            var r = getRuntime();
            if (!r || !r.layouts) return;
            var cur = r.running_layout && r.running_layout.name.toLowerCase();
            if (cur === 'battlescreen') return; // 已在战斗界面
            // 强制设置 changelayout
            var target = r.layouts['BattleScreen'] || r.layouts['battlescreen'];
            if (!target) {
                var keys = Object.keys(r.layouts);
                for (var i = 0; i < keys.length; i++) {
                    if (keys[i].toLowerCase() === 'battlescreen') { target = r.layouts[keys[i]]; break; }
                }
            }
            if (target) {
                r.changelayout = target;
                r._changeLayoutPending = false;
            }
        } catch(e){}
    }

    // 独立检测：runtime 就绪 → 移除 startScreen + 强制进战斗
    var startCheckInterval = setInterval(function(){
        try {
            var r = getRuntime();
            if (!r || !r.layouts) return;
            // startScreen 移除（最多等页面加载后 3 秒）
            var elapsed = Date.now() - (window.__bootStart || (window.__bootStart = Date.now()));
            if (!window.__startScreenHidden && elapsed > 1500) {
                doStart();
            }
            // 强制进 BattleScreen
            if (r.changelayout !== 'force_wait' && !window.__forceDone) {
                var cur = r.running_layout && r.running_layout.name.toLowerCase();
                if (cur && cur !== 'battlescreen') {
                    forceBattleScreen();
                    window.__forceDone = true;
                }
            }
            // 两个都搞定就停
            if (window.__startScreenHidden && window.__forceDone) {
                clearInterval(startCheckInterval);
            }
        } catch(e){}
    }, 200);

    if (ssBtn) {
        ssBtn.addEventListener('click', function(){ doStart(); forceBattleScreen(); });
        ssBtn.addEventListener('touchstart', function(e){ e.preventDefault(); doStart(); forceBattleScreen(); }, { passive: false });
    }

    // ── 窗口/方向变化时强制重算全屏 ──
    window.addEventListener('resize', function(){
        try {
            var r = getRuntime();
            if (r && typeof r.setSize === 'function') {
                r.setSize(window.innerWidth, window.innerHeight, true);
            }
        } catch(e){}
    });
    window.addEventListener('orientationchange', function(){
        setTimeout(function(){
            try {
                var r = getRuntime();
                if (r && typeof r.setSize === 'function') {
                    r.setSize(window.innerWidth, window.innerHeight, true);
                }
            } catch(e){}
        }, 300);
    });

    // 旧内联进度条清掉
    try { if (bar && bar.parentNode) bar.parentNode.removeChild(bar); } catch(e){}
    try { if (pct && pct.parentNode) pct.parentNode.removeChild(pct); } catch(e){}
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', vpadSetup);
} else {
    vpadSetup();
}
