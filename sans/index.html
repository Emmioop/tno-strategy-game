<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="appmanifest.json" />
    <title>Bad Time Simulator · Sans Fight</title>
    <style>
        * { padding: 0; margin: 0; }
        html, body {
            background: #000; color: #fff;
            overflow: hidden; touch-action: none;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
            -webkit-user-select: none; user-select: none;
            -webkit-touch-callout: none;
            height: 100%; width: 100%;
        }
        canvas { touch-action: none; -ms-touch-action: none; }
        #c2canvasdiv {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
        }
        #c2canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%; max-height: 100%;
        }
        #back-btn {
            position: fixed; top: 12px; left: 12px; z-index: 9999;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.6); border: 2px solid #ffffff80;
            color: #fff; font-size: 20px; line-height: 36px; text-align: center;
            cursor: pointer; text-decoration: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Courier New', monospace;
        }
        #back-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<a id="back-btn" href="../index.html" title="返回主菜单">←</a>

<div id="c2canvasdiv">
    <canvas id="c2canvas" width="640" height="480"></canvas>
</div>

<script src="jquery-3.4.1.min.js"></script>
<script src="c2runtime.js"></script>
<script>
    jQuery(document).ready(function() {
        cr_createRuntime("c2canvas");
    });

    function onVisibilityChanged() {
        if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
            cr_setSuspended(true);
        else
            cr_setSuspended(false);
    }
    document.addEventListener("visibilitychange", onVisibilityChanged, false);
    document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
    document.addEventListener("msvisibilitychange", onVisibilityChanged, false);

    // 全屏拉伸：适配移动端不同分辨率
    function cr_sizeCanvas_fit() {
        var c = document.getElementById("c2canvas");
        var d = document.getElementById("c2canvasdiv");
        if (!c || !d) return;
        var cw = 640, ch = 480;
        var dw = window.innerWidth, dh = window.innerHeight;
        var ratio = cw / ch;
        var dratio = dw / dh;
        if (dratio > ratio) {
            var newH = dh;
            var newW = dh * ratio;
        } else {
            var newW = dw;
            var newH = dw / ratio;
        }
        c.style.width = newW + 'px';
        c.style.height = newH + 'px';
    }
    window.addEventListener('resize', cr_sizeCanvas_fit);
    window.addEventListener('orientationchange', cr_sizeCanvas_fit);
    setTimeout(cr_sizeCanvas_fit, 500);
    setTimeout(cr_sizeCanvas_fit, 1500);
</script>

</body>
</html>
