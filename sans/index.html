<script>
// vpad.js - virtual buttons + auto-skip loader
'use strict';

var bar = document.createElement('div');
bar.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:3px;background:rgba(255,255,255,.15);z-index:999999;pointer-events:none;transition:opacity .6s;';
var fill = document.createElement('div');
fill.style.cssText = 'width:0%;height:100%;background:linear-gradient(90deg,#ff4444,#ff8844);transition:width .2s linear;';
bar.appendChild(fill);

var pct = document.createElement('div');
pct.style.cssText = 'position:fixed;top:8px;left:8px;z-index:999999;color:#fff;font:13px monospace;text-shadow:0 0 3px #000;pointer-events:none;';

// 安全添加元素到 body
function addToBody(el) {
    if (document.body) {
        document.body.appendChild(el);
    } else {
        document.addEventListener('DOMContentLoaded', function() {
            document.body.appendChild(el);
        });
    }
}

addToBody(bar);
addToBody(pct);

window.vpadDebug = { setupCalled: false, pollCalls: 0 };

function getRuntime() {
    var rt = document.getElementById('c2canvas') && document.getElementById('c2canvas').c2runtime;
    if (!rt) rt = window.c2runtime;
    return rt;
}
function getLayout(name) {
    var rt = getRuntime();
    if (!rt || !rt.layouts) return null;
    var keys = Object.keys(rt.layouts);
    for (var i = 0; i < keys.length; i++) {
        if (keys[i].toLowerCase() === name.toLowerCase()) return rt.layouts[keys[i]];
    }
    return null;
}

function vpadSetup() {
    window.vpadDebug.setupCalled = true;
    var tickBootstrapped = false;
    var origSizeFixed = false;

    setInterval(function(){
        window.vpadDebug.pollCalls++;
        try {
            var rt = getRuntime();
            if (!rt) return;

            if (rt.isSuspended) rt.isSuspended = false;

            // 强制修正 original_width/original_height（SetCanvasSize 会用 canvas 属性值覆盖 data.js 中的 960x540）
            if (!origSizeFixed && rt.original_width !== 960) {
                rt.original_width = 960;
                rt.original_height = 540;
                if (rt.setSize) rt.setSize(window.innerWidth, window.innerHeight, true);
                origSizeFixed = true;
            }

            var p = rt.progress || 0;
            fill.style.width = (p*100).toFixed(1)+'%';
            pct.textContent = 'Loading ' + Math.round(p*100) + '%';
            
            var cur = rt.running_layout && rt.running_layout.name;
            if (!cur) return;
            var n = cur.toLowerCase();
            
            if (n === 'battlescreen') {
                // 1. 用我们自己的 setInterval 驱动 tick 循环（绕过 headless 下 RAF 不稳定的问题）
                if (!tickBootstrapped) {
                    tickBootstrapped = true;
                    rt.raf_id = -1;
                    rt.timeout_id = -1;
                    window.__vpadTickInterval = setInterval(function(){
                        try {
                            var r = getRuntime();
                            if (r && !r.isSuspended) {
                                r.redraw = true;
                                r.tick(false);
                            }
                        } catch(e){}
                    }, 16);
                }
                
                // 2. 隐藏 Touch 层的全屏白色触摸区域实例
                try {
                    var layers = rt.running_layout.layers;
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase() === 'touch') {
                            layers[i].instances.forEach(function(inst){
                                inst.opacity = 0;
                            });
                            break;
                        }
                    }
                } catch(e){}
                
                // 3. 清空 Fade 层残留实例
                try {
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase() === 'fade') {
                            layers[i].instances.length = 0;
                            break;
                        }
                    }
                } catch(e){}
                
                // 4. CombatZoneClipped 禁用 destination-in 混合
                try {
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase().indexOf('clipped') >= 0) {
                            layers[i].forceOwnTexture = true;
                            layers[i].blend_mode = 0;
                        }
                    }
                } catch(e){}
                
                // 5. HP 保持满值 20/20
                try {
                    for (var i = 0; i < layers.length; i++) {
                        if (layers[i].name.toLowerCase() === 'hud') {
                            var insts = layers[i].instances;
                            for (var j = 0; j < insts.length; j++) {
                                var inst = insts[j];
                                if (inst.type.name === 't78' && inst.text && inst.text.indexOf('/') >= 0) {
                                    if (inst.text !== '20 / 20') inst.text = '20 / 20';
                                }
                                if (inst.type.name === 't41') inst.width = 100;
                                if (inst.type.name === 't40') {
                                    inst.width = 100;
                                    inst.instance_vars = [0, 100, 30];
                                }
                            }
                            break;
                        }
                    }
                } catch(e){}
                
                // 6. 隐藏进度条
                if (p >= 1) {
                    pct.style.opacity = '0';
                    bar.style.opacity = '0';
                }
            }
        } catch(e){}
    }, 150);
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', vpadSetup);
} else {
    vpadSetup();
}

</script>

    <div id="dbg-panel">
        <div><b>🔍 Debug Panel</b></div>
        <div>Loading... <span id="dbg-progress">0%</span></div>
        <div class="bar-wrap"><div class="bar" id="dbg-bar"></div></div>
        <div id="dbg-status" class="ok">waiting...</div>
        <div id="dbg-console" style="margin-top:6px;max-height:200px;overflow:auto"></div>
    </div>
    <script>
    (function(){
        var dp = document.getElementById('dbg-panel');
        var dc = document.getElementById('dbg-console');
        var db = document.getElementById('dbg-bar');
        var dpct = document.getElementById('dbg-progress');
        var ds = document.getElementById('dbg-status');
        function log(type, msg) {
            var d = new Date().toLocaleTimeString();
            var cls = type==='error'?'err':type==='warn'?'wrn':'ok';
            dc.innerHTML += '<div class="'+cls+'">['+d+'] '+type+': '+String(msg).slice(0,200)+'</div>';
            dc.scrollTop = dc.scrollHeight;
        }
        var _origC = console.log, _origE = console.error, _origW = console.warn;
        console.log = function(){ _origC.apply(console, arguments); log('log', [].slice.call(arguments).join(' ')); };
        console.error = function(){ _origE.apply(console, arguments); log('error', [].slice.call(arguments).join(' ')); };
        console.warn = function(){ _origW.apply(console, arguments); log('warn', [].slice.call(arguments).join(' ')); };

        window.addEventListener('error', function(e){ log('error', e.message + ' @ ' + (e.filename||'?') + ':' + (e.lineno||'?')); });

        var startTime = Date.now();

        setTimeout(function(){
            log('info', 'After 3s, checking runtime...');
            try {
                var rt = window.cr_getC2Runtime && window.cr_getC2Runtime();
                if (!rt) { log('error', 'cr_getC2Runtime returned null!'); ds.className='err'; ds.textContent='❌ Runtime NOT initialized'; return; }
                log('info', 'Runtime OK. layout=' + (rt.layout && rt.layout.name) + ', running=' + rt.running);
                log('info', 'layouts: ' + Object.keys(rt.layouts||{}).join(', '));
                ds.className='ok'; ds.textContent='✅ Runtime ready';
                dpct.textContent = '100%'; db.style.width='100%';
            } catch(e) { log('error', e); ds.className='err'; ds.textContent='❌ ' + e.message; }
        }, 3000);

        // 每 500ms 更新一次状态
        setInterval(function(){
            try {
                var rt = window.cr_getC2Runtime && window.cr_getC2Runtime();
                if (rt && rt.layout) {
                    var name = rt.layout.name || '?';
                    ds.textContent = '✅ Layout: ' + name;
                    dpct.textContent = '100%'; db.style.width='100%';
                }
            } catch(e){}
        }, 500);
    })();
    </script>
