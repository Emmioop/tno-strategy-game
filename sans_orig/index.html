    <style>
        #dbg-panel {
            position: fixed; top: 8px; right: 8px; z-index: 99999;
            width: 240px; background: rgba(0,0,0,0.85); color: #fff;
            font: 11px/1.5 monospace; border-radius: 6px; padding: 8px;
            max-height: 60vh; overflow: auto; pointer-events: none;
        }
        #dbg-panel .bar-wrap { height: 14px; background: #333; border-radius: 3px; margin: 4px 0; overflow: hidden; }
        #dbg-panel .bar { height: 100%; background: linear-gradient(90deg,#0f0,#0ff); width: 0%; transition: width .2s; }
        #dbg-panel .ok { color: #4f4; }
        #dbg-panel .err { color: #f44; }
        #dbg-panel .wrn { color: #ff4; }
    </style>
    <div id="dbg-panel">
        <div><b>🔍 Debug Panel</b></div>
        <div>Loading... <span id="dbg-progress">0%</span></div>
        <div class="bar-wrap"><div class="bar" id="dbg-bar"></div></div>
        <div id="dbg-status" class="ok">waiting...</div>
        <div id="dbg-console" style="margin-top:6px;max-height:200px;overflow:auto"></div>
    </div>
    <script>
    (function(){
        var dp = document.getElementById('dbg-panel');
        var dc = document.getElementById('dbg-console');
        var db = document.getElementById('dbg-bar');
        var dpct = document.getElementById('dbg-progress');
        var ds = document.getElementById('dbg-status');
        function log(type, msg) {
            var d = new Date().toLocaleTimeString();
            var cls = type==='error'?'err':type==='warn'?'wrn':'ok';
            dc.innerHTML += '<div class="'+cls+'">['+d+'] '+type+': '+String(msg).slice(0,200)+'</div>';
            dc.scrollTop = dc.scrollHeight;
        }
        var _origC = console.log, _origE = console.error, _origW = console.warn;
        console.log = function(){ _origC.apply(console, arguments); log('log', [].slice.call(arguments).join(' ')); };
        console.error = function(){ _origE.apply(console, arguments); log('error', [].slice.call(arguments).join(' ')); };
        console.warn = function(){ _origW.apply(console, arguments); log('warn', [].slice.call(arguments).join(' ')); };

        window.addEventListener('error', function(e){ log('error', e.message + ' @ ' + (e.filename||'?') + ':' + (e.lineno||'?')); });

        var startTime = Date.now();

        setTimeout(function(){
            log('info', 'After 3s, checking runtime...');
            try {
                var rt = window.cr_getC2Runtime && window.cr_getC2Runtime();
                if (!rt) { log('error', 'cr_getC2Runtime returned null!'); ds.className='err'; ds.textContent='❌ Runtime NOT initialized'; return; }
                log('info', 'Runtime OK. layout=' + (rt.layout && rt.layout.name) + ', running=' + rt.running);
                log('info', 'layouts: ' + Object.keys(rt.layouts||{}).join(', '));
                ds.className='ok'; ds.textContent='✅ Runtime ready';
                dpct.textContent = '100%'; db.style.width='100%';
            } catch(e) { log('error', e); ds.className='err'; ds.textContent='❌ ' + e.message; }
        }, 3000);

        // 每 500ms 更新一次状态
        setInterval(function(){
            try {
                var rt = window.cr_getC2Runtime && window.cr_getC2Runtime();
                if (rt && rt.layout) {
                    var name = rt.layout.name || '?';
                    ds.textContent = '✅ Layout: ' + name;
                    dpct.textContent = '100%'; db.style.width='100%';
                }
            } catch(e){}
        }, 500);
    })();
    </script>

    <!-- The runtime script.  You can rename it, but don't forget to rename the reference here as well.
    This file will have been minified and obfuscated if you enabled "Minify script" during export. -->
	<script src="c2runtime.js"></script>

    

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			cr_createRuntime("c2canvas");
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
				
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW()
		{
			if (!navigator.serviceWorker)
				return;		// no SW support, ignore call
			
			try {
				navigator.serviceWorker.register("sw.js", { scope: "./" })
				.then(function (reg)
				{
					console.log("Registered service worker on " + reg.scope);
				})
				.catch(OnRegisterSWError);
			}
			catch (e)
			{
				OnRegisterSWError(e);
			}
		};
    </script>
